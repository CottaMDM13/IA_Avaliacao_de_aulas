<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro</title>
    {{ bootstrap.load_css() }}
</head>
<body>
    <div class="container">
        <h1>Erro</h1>
        <div class="alert alert-danger" role="alert">
            {{ error }}

        <a href="{{ url_for('reports') }}" class="btn btn-secondary">Ver Relatórios</a>
    </div>
    {{ bootstrap.load_js() }}
</body>
</html>
