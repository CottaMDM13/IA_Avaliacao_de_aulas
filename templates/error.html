<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro</title>
    {{ bootstrap.load_css() }}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F3F4F6; color: #1F2937; }
        .container { max-width: 500px; margin: 2rem auto; padding: 1.5rem; background: #FFFFFF; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .alert { color: #EF4444; font-weight: 600; margin-bottom: 1rem; }
        .btn-secondary { background: #6B7280; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; color: #FFFFFF; transition: background 0.2s; }
        .btn-secondary:hover { background: #4B5563; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; }
        @media (max-width: 576px) { .container { margin: 1rem; padding: 1rem; } h2 { font-size: 1.25rem; } }
    </style>
</head>
<body>
    <div class="container">
        <h2>Erro</h2>
        <p class="alert">{{ error }}</p>
        <a href="/" class="btn btn-secondary">Voltar</a>
    </div>
    {{ bootstrap.load_js() }}
</body>
</html>
