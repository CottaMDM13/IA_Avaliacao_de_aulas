<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Vídeos</title>
    {{ bootstrap.load_css() }}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F3F4F6; color: #1F2937; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #FFFFFF; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1.5rem; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        .btn-primary { background: #3B82F6; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; transition: background 0.2s; }
        .btn-primary:hover { background: #2563EB; }
        .btn-secondary { background: #6B7280; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; color: #FFFFFF; }
        .btn-secondary:hover { background: #4B5563; }
        .progress { height: 1.5rem; margin-top: 1rem; }
        .alert { display: none; background: #FEF2F2; color: #991B1B; border-radius: 6px; padding: 1rem; text-align: center; }
        @media (max-width: 576px) { .card { padding: 1rem; } h2 { font-size: 1.25rem; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Upload de Vídeos</h2>
            <form id="uploadForm" action="/" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="videos">Selecione os vídeos (.mp4)</label>
                    <input type="file" class="form-control" id="videos" name="videos" accept=".mp4" multiple required>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
                <a href="/reports" class="btn btn-secondary">Ver Relatórios</a>
            </form>
            <div id="alert" class="alert"></div>
            <div class="progress" id="progressBarContainer" style="display: none;">
                <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
        </div>
    </div>
    {{ bootstrap.load_js() }}
    <script>
        const form = document.getElementById('uploadForm');
        const progressBar = document.getElementById('progressBar');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const alertBox = document.getElementById('alert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            progressBarContainer.style.display = 'block';
            alertBox.style.display = 'none';

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.error) {
                    alertBox.textContent = data.error;
                    alertBox.style.display = 'block';
                    progressBarContainer.style.display = 'none';
                    return;
                }
                const sessionId = data.session_id;
                const checkProgress = async () => {
                    const progressResponse = await fetch(`/progress/${sessionId}`);
                    const progressData = await progressResponse.json();
                    if (progressData.error) {
                        alertBox.textContent = progressData.error;
                        alertBox.style.display = 'block';
                        progressBarContainer.style.display = 'none';
                        return;
                    }
                    const percentage = progressData.percentage.toFixed(0);
                    progressBar.style.width = `${percentage}%`;
                    progressBar.textContent = `${percentage}%`;
                    progressBar.setAttribute('aria-valuenow', percentage);
                    if (percentage < 100) {
                        setTimeout(checkProgress, 1000);
                    } else {
                        window.location.href = data.redirect;
                    }
                };
                await checkProgress();
            } catch (error) {
                alertBox.textContent = `Erro ao enviar vídeos: ${error.message}`;
                alertBox.style.display = 'block';
                progressBarContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
