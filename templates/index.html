<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Vídeos</title>
    {{ bootstrap.load_css() }}
</head>
<body>
    <div class="container">
        <h1>Upload de Vídeos</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="videos" class="form-label">Selecione os vídeos (.mp4)</label>
                <input type="file" class="form-control" id="videos" name="videos" multiple accept=".mp4">
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
            <a href="{{ url_for('reports') }}" class="btn btn-secondary">Ver Relatórios</a>
        </form>
    </div>
    {{ bootstrap.load_js() }}
</body>
</html>
