<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Vídeos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { margin-top: 50px; }
        .progress { height: 30px; margin-top: 20px; display: none; }
        .progress-bar { transition: width 0.5s ease-in-out; }
        #uploadStatus { margin-top: 20px; }
        .btn-group { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Upload de Vídeos para Avaliação</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="videos" class="form-label">Selecione os vídeos (.mp4):</label>
                <input type="file" class="form-control" id="videos" name="videos" accept="video/mp4" multiple required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Enviar</button>
                <a href="{{ url_for('reports') }}" class="btn btn-info">Ver Relatórios</a>
            </div>
        </form>
        <div id="uploadStatus"></div>
        <div class="progress" id="progressBar">
            <div class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const statusDiv = document.getElementById('uploadStatus');
            const progressBar = document.getElementById('progressBar');
            const progressBarInner = progressBar.querySelector('.progress-bar');

            statusDiv.innerHTML = '<div class="alert alert-info">Enviando vídeos...</div>';
            progressBar.style.display = 'block';
            progressBarInner.style.width = '0%';
            progressBarInner.textContent = '0%';

            try {
                console.log('Iniciando upload de vídeos...');
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`Erro na resposta do servidor: ${response.status} ${response.statusText}`, errorText);
                    throw new Error(`Erro ${response.status}: ${errorText || response.statusText}`);
                }

                const result = await response.json();
                console.log('Resposta do servidor:', result);

                if (result.error) {
                    statusDiv.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
                    progressBar.style.display = 'none';
                    return;
                }

                const sessionId = result.session_id;
                statusDiv.innerHTML = '<div class="alert alert-info">Processando vídeos...</div>';

                const interval = setInterval(async () => {
                    try {
                        const progressResponse = await fetch(`/progress/${sessionId}`);
                        const progress = await progressResponse.json();

                        if (progress.error) {
                            console.error('Erro no progresso:', progress.error);
                            statusDiv.innerHTML = `<div class="alert alert-danger">${progress.error}</div>`;
                            clearInterval(interval);
                            progressBar.style.display = 'none';
                            return;
                        }

                        const percentage = progress.percentage.toFixed(2);
                        progressBarInner.style.width = `${percentage}%`;
                        progressBarInner.textContent = `${percentage}%`;
                        progressBarInner.setAttribute('aria-valuenow', percentage);

                        if (percentage >= 100) {
                            clearInterval(interval);
                            statusDiv.innerHTML = '<div class="alert alert-success">Processamento concluído!</div>';
                            setTimeout(() => {
                                window.location.href = result.redirect;
                            }, 1000);
                        }
                    } catch (err) {
                        console.error('Erro ao atualizar progresso:', err);
                        statusDiv.innerHTML = `<div class="alert alert-danger">Erro ao atualizar progresso: ${err.message}</div>`;
                        clearInterval(interval);
                        progressBar.style.display = 'none';
                    }
                }, 1000);
            } catch (err) {
                console.error('Erro ao enviar vídeos:', err);
                statusDiv.innerHTML = `<div class="alert alert-danger">Erro ao enviar vídeos: ${err.message}</div>`;
                progressBar.style.display = 'none';
            }
        });
    </script>
</body>
</html>
